<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Error - Heisenberg</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-pink: #f43f5e;
            --border-color: #0f172a;
        }

        body {
            height: 100vh;
            font-family: 'Outfit', -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            text-align: center;
            max-width: 500px;
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        .error-title {
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 16px;
            color: var(--accent-pink);
        }

        .error-message {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .error-details {
            background: #fef2f2;
            border: 2px solid var(--accent-pink);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 32px;
        }

        .error-details p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .error-details code {
            background: #fee2e2;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: 700;
        }

        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 32px;
            background: var(--accent-pink);
            color: white;
            border: 2px solid var(--border-color);
            box-shadow: 6px 6px 0px var(--border-color);
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }

        .retry-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px var(--border-color);
        }

        .retry-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border-color);
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1 class="error-title">Connection Error</h1>

        <div class="error-details">
            <p>The server is not running or cannot be reached.</p>
            <p>Make sure to start the server first:</p>
            <p><code>py main_web.py</code></p>
        </div>


        <button class="retry-btn" onclick="retryConnection()">
            🔄 Retry Connection
        </button>
    </div>

    <script>
        const serverUrl = 'http://127.0.0.1:8000/';
        
        function retryConnection() {
            window.location.href = serverUrl;
        }
    </script>
</body>

</html>
