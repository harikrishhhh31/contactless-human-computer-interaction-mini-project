<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAND GESTURES | HEISENBERG</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="navigateTo('index.html')">
                BACK
            </button>
            <h1 class="page-title">Hand Gestures</h1>
        </div>

        <div class="gesture-grid">
            <div class="gesture-card">
                <img src="../assets/images/gesture-1-finger.png" alt="1 Finger">
                <div class="gesture-name">1 Finger</div>
                <div class="gesture-action">MOVE CURSOR</div>
            </div>

            <div class="gesture-card">
                <img src="../assets/images/gesture-2-fingers.png" alt="2 Fingers">
                <div class="gesture-name">Index + Thumb</div>
                <div class="gesture-action">LEFT CLICK</div>
            </div>

            <div class="gesture-card">
                <img src="../assets/images/gesture-3-fingers.png" alt="3 Fingers">
                <div class="gesture-name">Index + Middle</div>
                <div class="gesture-action">RIGHT CLICK</div>
            </div>

            <div class="gesture-card">
                <img src="../assets/images/gesture-4-fingers.png" alt="4 Fingers">
                <div class="gesture-name">Index + Middle + Ring</div>
                <div class="gesture-action">DOUBLE CLICK</div>
            </div>

            <div class="gesture-card">
                <img src="../assets/images/gesture-5-fingers-scroll.png" alt="5 Fingers">
                <div class="gesture-name">4 Fingers</div>
                <div class="gesture-action">SCROLL (UP/DOWN)</div>
            </div>

            <div class="gesture-card">
                <img src="../assets/images/gesture-thumbs-up.png" alt="Thumbs Up">
                <div class="gesture-name">Thumbs Up</div>
                <div class="gesture-action">VOLUME UP</div>
            </div>

            <div class="gesture-card">
                <img src="../assets/images/gesture-thumbs-down.png" alt="Thumbs Down">
                <div class="gesture-name">Thumbs Down</div>
                <div class="gesture-action">VOLUME DOWN</div>
            </div>
        </div>

        <div class="tip-box">
            <div class="tip-icon">&#128161;</div>
            <div class="tip-content">
                <strong>Optimal Usage</strong>
                Ensure adequate lighting and a clear background for best gesture recognition response. ⚡
            </div>
        </div>

        <div class="footer">
        </div>
    </div>

    <script src="../assets/js/app.js"></script>
</body>

</html>
